<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUNO WORKS | Plot Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#14121b;color:#eee8f5;font:15px system-ui,sans-serif}header{padding:24px;border-bottom:1px solid #42364f}small{color:#b9a3d5;letter-spacing:2px}h1{margin:5px 0;font-size:26px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1300px;margin:auto}section{background:#211c2a;border:1px solid #42364f;border-radius:12px;padding:16px;min-width:0}button,select,input,textarea{font:inherit;color:inherit;background:#30273e;border:1px solid #655477;border-radius:7px;padding:10px}button{cursor:pointer}button:hover{background:#514064}textarea{width:100%;min-height:260px;font:13px monospace;resize:vertical}label{display:block;margin:12px 0 5px}input:not([type=color]){width:100%}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}iframe{width:100%;height:650px;border:0;background:#15151b;border-radius:8px}#status{color:#c8b3e6} @media(max-width:760px){main{grid-template-columns:1fr}iframe{height:520px}}</style><header><small>LUNO WORKS / TALELYNX DESIGN TOOLS</small><h1>Plot Studio</h1>HTML Designer · v0.2</header><main><section><h2>編集</h2><label>配色テンプレート</label><select id="theme"><option value="0">白虎 · 氷雪</option><option value="1">黒豹 · 深緑</option><option value="2">獅子 · 王室</option><option value="3">紫 · オリジナル</option></select><div class="bar"><button id="new">テンプレートを生成</button><button id="import">HTML読込</button><input type="file" id="file" accept=".html,.txt" hidden></div><label>ブロック追加（カーソル位置）</label><div class="bar" id="blocks"></div><label for="code">HTMLソース</label><textarea id="code" spellcheck="false"></textarea><div class="bar"><button id="copy">HTMLコピー</button><button id="save">HTML書き出し</button></div><div id="status" role="status"></div><p>下書きはこのブラウザ内に保存されます。公開リポジトリには送信しません。</p></section><section><h2>プレビュー</h2><div class="bar"><button id="mobile">スマホ</button><button id="desktop">PC</button><button id="dark">Dark</button><button id="light">Light</button></div><iframe id="preview" sandbox="" title="HTMLプレビュー"></iframe><p>画像タグは仮表示。Talelynx本体での表示確認が必要です。</p></section></main><script>
const $=id=>document.getElementById(id),code=$('code'),themes=[['#101a2b','#e9edf3','#c9b48e','#62778f','#1b2b40'],['#111512','#e8dfcf','#bda071','#786344','#1b201c'],['#241914','#f2e6d3','#cda76d','#967044','#38231c'],['#1c1628','#f0e8f5','#c6addd','#79648f','#30243e']];let light=false;const colors=()=>themes[+$('theme').value];function parts(){let [bg,fg,a,b,p]=colors();return {'見出し':'<div style="color:'+a+';font-size:10px;letter-spacing:2px;">01 — PROFILE</div>\n<div style="font-size:19px;margin:6px 0 12px;">見出し</div>','本文':'<div style="font-size:13px;line-height:1.8;">本文</div>','画像':'<div style="margin:12px 0;">{{img:画像名}}</div>','区切り':'<div style="height:1px;background:'+b+';margin:18px 0;"></div>','引用':'<div style="background:'+p+';border-left:2px solid '+a+';padding:12px;margin:12px 0;">台詞・引用</div>','折りたたみ':'<details style="border:1px solid '+b+';border-radius:5px;margin:16px 0;background:'+p+';"><summary style="padding:12px;">詳細プロフィール</summary><div style="padding:12px;">詳細本文</div></details>'}}
function template(){let [bg,fg,a,b,p]=colors();return '<div style="max-width:680px;margin:0 auto;background:'+bg+';color:'+fg+';padding:12px;font-family:Georgia,serif;line-height:1.75;">\n<div style="border:1px solid '+b+';padding:16px 13px;">\n<div style="text-align:center;color:'+a+';font-size:10px;letter-spacing:2px;">CHARACTER ARCHIVE</div>\n<div style="text-align:center;font-size:36px;letter-spacing:4px;">CHARACTER</div>\n<div style="text-align:center;color:'+a+';font-size:12px;">キャラクター名</div>\n'+Object.values(parts()).join('\n')+'\n</div>\n</div>'}
function render(){let safe=code.value.replace(/\{\{img:([^}]+)\}\}/g,(_,n)=>'<div style="padding:32px 8px;text-align:center;border:1px dashed #888;">画像：'+n.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div>');$('preview').srcdoc='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:"><meta name="viewport" content="width=device-width"><style>body{margin:8px;background:'+(light?'#eee':'#17171b')+'}*{box-sizing:border-box}img{max-width:100%}</style>'+safe;let saved=true;try{localStorage.setItem('luno-plot-draft',code.value)}catch(e){saved=false}$('status').textContent=code.value.length+'文字 · '+(saved?'自動保存済み':'自動保存不可')}
for(let k of Object.keys(parts())){let b=document.createElement('button');b.textContent=k;b.onclick=()=>{code.setRangeText('\n'+parts()[k]+'\n',code.selectionStart,code.selectionEnd,'end');render();code.focus()};$('blocks').append(b)}
$('new').onclick=()=>{if(!code.value||confirm('現在の下書きを置き換えますか？')){code.value=template();render()}};code.oninput=render;$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{let f=$('file').files[0];if(f&&confirm('現在の下書きを置き換えますか？')){code.value=await f.text();render()}$('file').value=''};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code.value);$('status').textContent='コピーしました'}catch(e){code.focus();code.select();$('status').textContent='選択したHTMLを手動でコピーしてください'}};$('save').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code.value],{type:'text/html'}));a.download='talelynx-profile.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('mobile').onclick=()=>{$('preview').style.maxWidth='390px'};$('desktop').onclick=()=>{$('preview').style.maxWidth='100%'};$('dark').onclick=()=>{light=false;render()};$('light').onclick=()=>{light=true;render()};try{code.value=localStorage.getItem('luno-plot-draft')??template()}catch(e){code.value=template()}render();
</script>
<style>
#tabs{position:sticky;top:0;z-index:5;background:#14121b;padding:10px 16px;display:flex;gap:8px;border-bottom:1px solid #42364f}#tabs button[aria-pressed=true]{background:#765b98;color:white}main.single{display:block;max-width:900px}main.single section{margin-bottom:16px}section[hidden]{display:none!important}.blockcard{border:1px solid #655477;border-radius:9px;padding:12px;margin:12px 0}.blockcard textarea{min-height:75px;font:inherit}.blockcard input[type=number]{width:85px}.blockcard select{max-width:100%}.palette{display:flex;flex-wrap:wrap;gap:12px}.palette label{font-size:12px}.palette input{display:block;width:48px;height:36px;padding:2px}#visual textarea{min-height:75px;font:inherit}#visual .bar button{font-size:13px}button:disabled{opacity:.4}
</style>
<script>
(()=>{
const main=document.querySelector('main'), old=main.children[0], preview=main.children[1], visual=document.createElement('section');visual.id='visual';main.prepend(visual);main.classList.add('single');
const tabs=document.createElement('nav');tabs.id='tabs';main.before(tabs);let active=0;
['ビジュアル編集','プレビュー','HTML'].forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);tabs.append(b)});
function show(i){active=i;[visual,preview,old].forEach((el,j)=>el.hidden=i!==j);[...tabs.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));if(i===1)render()}
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/\n/g,'<br>');
const kinds=['タイトル','見出し','本文','画像','区切り','引用','折りたたみ','プロフィール2列'];
const defaults=k=>({kind:k,text:({タイトル:'CHARACTER',見出し:'人物紹介',本文:'紹介文',画像:'1',引用:'台詞',折りたたみ:'詳細プロフィール','プロフィール2列':'AGE / HEIGHT'})[k]||'',extra:k==='タイトル'?'キャラクター名':k==='折りたたみ'?'詳細本文':k==='プロフィール2列'?'RACE / TITLE':'',size:k==='タイトル'?32:k==='見出し'?19:13,align:k==='タイトル'?'center':'left',space:12,line:1.8,width:100});
let state={palette:[...themes[3]],blocks:['タイトル','見出し','本文','画像','区切り','引用','折りたたみ'].map(defaults)}, images={};let lastGenerated=null;
try{let x=JSON.parse(localStorage.getItem('luno-visual-v2')||'null');if(x&&Array.isArray(x.blocks)&&x.palette){state=x;lastGenerated=x.lastGenerated||null}}catch(e){}
visual.innerHTML='<h2>ビジュアル編集</h2><p>文章と装飾を組み立てるモードです。既存HTMLはHTMLタブに保持されます。</p><label>配色テーマ</label><select id="vtheme"><option value="">選択してください</option><option value="0">白虎 · 氷雪</option><option value="1">黒豹 · 深緑</option><option value="2">獅子 · 王室</option><option value="3">紫 · オリジナル</option></select><div class="palette" id="palette"></div><div class="bar"><button id="presetSave">配色を保存</button><button id="presetLoad">保存した配色</button></div><div id="vblocks"></div><label>ブロックを追加</label><div class="bar" id="vadd"></div><div class="bar"><button id="applyVisual">HTMLに反映してプレビュー</button><button id="backupVisual">編集データ書き出し</button><button id="restoreVisual">編集データ読込</button><input id="restoreFile" type="file" accept=".json" hidden></div><p id="vstatus" role="status"></p>';
function persist(){try{localStorage.setItem('luno-visual-v2',JSON.stringify({...state,lastGenerated}));$('vstatus').textContent='編集データ保存済み'}catch(e){$('vstatus').textContent='自動保存不可。書き出してください'}}
function generate(){let [bg,fg,a,b,p]=state.palette;let out=state.blocks.map(x=>{let style='font-size:'+Number(x.size)+'px;text-align:'+x.align+';margin:'+Number(x.space)+'px 0;line-height:'+Number(x.line)+';';let t=E(x.text),q=E(x.extra);switch(x.kind){case 'タイトル':return '<div style="'+style+'color:'+fg+';letter-spacing:3px;">'+t+'<div style="font-size:12px;color:'+a+';letter-spacing:1px;">'+q+'</div></div>';case '見出し':return '<div style="'+style+'color:'+a+';">'+t+'</div>';case '画像':return '<div style="width:'+Number(x.width)+'%;margin:'+Number(x.space)+'px auto;">{{img:'+t+'}}</div>';case '区切り':return '<div style="height:1px;background:'+b+';margin:'+Number(x.space)+'px 0;"></div>';case '引用':return '<div style="'+style+'background:'+p+';border-left:2px solid '+a+';padding:12px;">'+t+'</div>';case '折りたたみ':return '<details style="border:1px solid '+b+';background:'+p+';border-radius:5px;margin:'+Number(x.space)+'px 0;"><summary style="padding:12px;">'+t+'</summary><div style="'+style+'padding:12px;">'+q+'</div></details>';case 'プロフィール2列':return '<div style="display:flex;gap:8px;margin:'+Number(x.space)+'px 0;"><div style="flex:1;min-width:0;background:'+p+';padding:10px;'+style+'">'+t+'</div><div style="flex:1;min-width:0;background:'+p+';padding:10px;'+style+'">'+q+'</div></div>';default:return '<div style="'+style+'">'+t+'</div>'}});return '<div style="max-width:680px;margin:0 auto;background:'+bg+';color:'+fg+';padding:12px;font-family:Georgia,serif;line-height:1.75;">\n<div style="border:1px solid '+b+';padding:16px 13px;">\n'+out.join('\n')+'\n</div>\n</div>'}
function draw(){let pal=$('palette');pal.replaceChildren();['背景','文字','アクセント','枠','カード'].forEach((n,i)=>{let l=document.createElement('label'),v=document.createElement('input');l.textContent=n;v.type='color';v.value=state.palette[i];v.oninput=()=>{state.palette[i]=v.value;persist()};l.append(v);pal.append(l)});let list=$('vblocks');list.replaceChildren();state.blocks.forEach((x,i)=>{let box=document.createElement('div');box.className='blockcard';let h=document.createElement('strong');h.textContent=(i+1)+' · '+x.kind;box.append(h);let bar=document.createElement('div');bar.className='bar';[['↑',-1],['↓',1],['削除',0]].forEach(([n,d])=>{let b=document.createElement('button');b.textContent=n;b.disabled=d!==0&&(i+d<0||i+d>=state.blocks.length);b.onclick=()=>{if(d===0){if(!confirm('ブロックを削除しますか？'))return;state.blocks.splice(i,1)}else [state.blocks[i],state.blocks[i+d]]=[state.blocks[i+d],state.blocks[i]];draw();persist()};bar.append(b)});box.append(bar);
function field(label,key,type,opts){let l=document.createElement('label');l.textContent=label;let v=document.createElement(type==='textarea'?'textarea':type==='select'?'select':'input');if(type==='select')opts.forEach(o=>{let op=document.createElement('option');op.value=o;op.textContent=o;v.append(op)});else if(type!=='textarea')v.type=type;v.value=x[key];if(type==='number'){v.min=key==='line'?1:0;v.max=key==='line'?3:key==='width'?100:80;v.step=key==='line'?.1:1}v.oninput=()=>{x[key]=type==='number'?Math.min(+v.max,Math.max(+v.min,+v.value)):v.value;persist()};l.append(v);box.append(l)}
if(x.kind!=='区切り')field(x.kind==='画像'?'画像名':'テキスト','text','textarea');if(['タイトル','折りたたみ','プロフィール2列'].includes(x.kind))field('補足・右列','extra','textarea');if(!['画像','区切り'].includes(x.kind)){field('文字サイズ(px)','size','number');field('文字揃え','align','select',['left','center','right']);field('行間','line','number')}field('上下余白(px)','space','number');if(x.kind==='画像'){field('画像幅(%)','width','number');let f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{let file=f.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{images[x.text]=reader.result;$('vstatus').textContent='画像を一時登録しました（再読み込みで消えます）'};reader.readAsDataURL(file)};box.append(f)}list.append(box)})}
kinds.forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{state.blocks.push(defaults(k));draw();persist()};$('vadd').append(b)});
$('vtheme').onchange=e=>{if(e.target.value!==''){state.palette=[...themes[+e.target.value]];draw();persist()}};
$('presetSave').onclick=()=>{try{localStorage.setItem('luno-palette',JSON.stringify(state.palette));$('vstatus').textContent='配色を保存しました'}catch(e){$('vstatus').textContent='保存できませんでした'}};
$('presetLoad').onclick=()=>{try{let p=JSON.parse(localStorage.getItem('luno-palette'));if(p){state.palette=p;draw();persist()}}catch(e){}};
$('applyVisual').onclick=()=>{if(code.value&&code.value!==lastGenerated&&!confirm('HTMLタブの現在の内容を置き換えます。必要なら先に書き出してください。続けますか？'))return;code.value=generate();lastGenerated=code.value;persist();show(1)};
$('backupVisual').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='plot-studio.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('restoreVisual').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async()=>{try{let f=$('restoreFile').files[0];if(!f)return;let v=JSON.parse(await f.text());if(!Array.isArray(v.blocks)||!Array.isArray(v.palette)||v.palette.length!==5||!v.palette.every(c=>/^#[0-9a-f]{6}$/i.test(c))||!v.blocks.every(x=>kinds.includes(x.kind)&&typeof x.text==='string'&&typeof x.extra==='string'&&['left','center','right'].includes(x.align)&&['size','space','line','width'].every(k=>typeof x[k]==='number'&&Number.isFinite(x[k]))))throw Error();if(confirm('ビジュアル編集データを置き換えますか？')){state=v;draw();persist()}}catch(e){alert('対応するJSONではありません')}finally{$('restoreFile').value=''}};
const baseRender=render;render=function(){baseRender();let frame=$('preview');let html=frame.srcdoc;for(let [name,url] of Object.entries(images)){if(!/^data:image\/(?:png|jpeg|gif|webp|avif);base64,/i.test(url))continue;let marker='<div style="padding:32px 8px;text-align:center;border:1px dashed #888;">画像：'+E(name)+'</div>';html=html.split(marker).join('<img alt="" style="width:100%;height:auto;" src="'+url+'">')}if(html!==frame.srcdoc)frame.srcdoc=html};
draw();show(0);
})();
</script></html>
