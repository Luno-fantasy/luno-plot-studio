<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUNO WORKS | Plot Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#14121b;color:#eee8f5;font:15px system-ui,sans-serif}header{padding:24px;border-bottom:1px solid #42364f}small{color:#b9a3d5;letter-spacing:2px}h1{margin:5px 0;font-size:26px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1300px;margin:auto}section{background:#211c2a;border:1px solid #42364f;border-radius:12px;padding:16px;min-width:0}button,select,input,textarea{font:inherit;color:inherit;background:#30273e;border:1px solid #655477;border-radius:7px;padding:10px}button{cursor:pointer}button:hover{background:#514064}textarea{width:100%;min-height:260px;font:13px monospace;resize:vertical}label{display:block;margin:12px 0 5px}input:not([type=color]){width:100%}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}iframe{width:100%;height:650px;border:0;background:#15151b;border-radius:8px}#status{color:#c8b3e6} @media(max-width:760px){main{grid-template-columns:1fr}iframe{height:520px}}</style><header><small>LUNO WORKS / TALELYNX DESIGN TOOLS</small><h1>Plot Studio</h1>HTML Designer · v0.1</header><main><section><h2>編集</h2><label>配色テンプレート</label><select id="theme"><option value="0">白虎 · 氷雪</option><option value="1">黒豹 · 深緑</option><option value="2">獅子 · 王室</option><option value="3">紫 · オリジナル</option></select><div class="bar"><button id="new">テンプレートを生成</button><button id="import">HTML読込</button><input type="file" id="file" accept=".html,.txt" hidden></div><label>ブロック追加（カーソル位置）</label><div class="bar" id="blocks"></div><label for="code">HTMLソース</label><textarea id="code" spellcheck="false"></textarea><div class="bar"><button id="copy">HTMLコピー</button><button id="save">HTML書き出し</button></div><div id="status" role="status"></div><p>下書きはこのブラウザ内に保存されます。公開リポジトリには送信しません。</p></section><section><h2>プレビュー</h2><div class="bar"><button id="mobile">スマホ</button><button id="desktop">PC</button><button id="dark">Dark</button><button id="light">Light</button></div><iframe id="preview" sandbox="" title="HTMLプレビュー"></iframe><p>画像タグは仮表示。Talelynx本体での表示確認が必要です。</p></section></main><script>
const $=id=>document.getElementById(id),code=$('code'),themes=[['#101a2b','#e9edf3','#c9b48e','#62778f','#1b2b40'],['#111512','#e8dfcf','#bda071','#786344','#1b201c'],['#241914','#f2e6d3','#cda76d','#967044','#38231c'],['#1c1628','#f0e8f5','#c6addd','#79648f','#30243e']];let light=false;const colors=()=>themes[+$('theme').value];function parts(){let [bg,fg,a,b,p]=colors();return {'見出し':'<div style="color:'+a+';font-size:10px;letter-spacing:2px;">01 — PROFILE</div>\n<div style="font-size:19px;margin:6px 0 12px;">見出し</div>','本文':'<div style="font-size:13px;line-height:1.8;">本文</div>','画像':'<div style="margin:12px 0;">{{img:画像名}}</div>','区切り':'<div style="height:1px;background:'+b+';margin:18px 0;"></div>','引用':'<div style="background:'+p+';border-left:2px solid '+a+';padding:12px;margin:12px 0;">台詞・引用</div>','折りたたみ':'<details style="border:1px solid '+b+';border-radius:5px;margin:16px 0;background:'+p+';"><summary style="padding:12px;">詳細プロフィール</summary><div style="padding:12px;">詳細本文</div></details>'}}
function template(){let [bg,fg,a,b,p]=colors();return '<div style="max-width:680px;margin:0 auto;background:'+bg+';color:'+fg+';padding:12px;font-family:Georgia,serif;line-height:1.75;">\n<div style="border:1px solid '+b+';padding:16px 13px;">\n<div style="text-align:center;color:'+a+';font-size:10px;letter-spacing:2px;">CHARACTER ARCHIVE</div>\n<div style="text-align:center;font-size:36px;letter-spacing:4px;">CHARACTER</div>\n<div style="text-align:center;color:'+a+';font-size:12px;">キャラクター名</div>\n'+Object.values(parts()).join('\n')+'\n</div>\n</div>'}
function render(){let safe=code.value.replace(/\{\{img:([^}]+)\}\}/g,(_,n)=>'<div style="padding:32px 8px;text-align:center;border:1px dashed #888;">画像：'+n.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div>');$('preview').srcdoc='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:"><meta name="viewport" content="width=device-width"><style>body{margin:8px;background:'+(light?'#eee':'#17171b')+'}*{box-sizing:border-box}img{max-width:100%}</style>'+safe;let saved=true;try{localStorage.setItem('luno-plot-draft',code.value)}catch(e){saved=false}$('status').textContent=code.value.length+'文字 · '+(saved?'自動保存済み':'自動保存不可')}
for(let k of Object.keys(parts())){let b=document.createElement('button');b.textContent=k;b.onclick=()=>{code.setRangeText('\n'+parts()[k]+'\n',code.selectionStart,code.selectionEnd,'end');render();code.focus()};$('blocks').append(b)}
$('new').onclick=()=>{if(!code.value||confirm('現在の下書きを置き換えますか？')){code.value=template();render()}};code.oninput=render;$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{let f=$('file').files[0];if(f&&confirm('現在の下書きを置き換えますか？')){code.value=await f.text();render()}$('file').value=''};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code.value);$('status').textContent='コピーしました'}catch(e){code.focus();code.select();$('status').textContent='選択したHTMLを手動でコピーしてください'}};$('save').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code.value],{type:'text/html'}));a.download='talelynx-profile.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('mobile').onclick=()=>{$('preview').style.maxWidth='390px'};$('desktop').onclick=()=>{$('preview').style.maxWidth='100%'};$('dark').onclick=()=>{light=false;render()};$('light').onclick=()=>{light=true;render()};try{code.value=localStorage.getItem('luno-plot-draft')??template()}catch(e){code.value=template()}render();
</script></html>
